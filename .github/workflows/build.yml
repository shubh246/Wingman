name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|e: |What went wrong|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Wingman.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Wingman-apk
          path: Wingman.apk
      - name: Publish as "latest" release (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wingman (latest build)
          files: Wingman.apk
          make_latest: true
