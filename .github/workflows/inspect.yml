name: Inspect ML Kit GenAI
on:
  push:
    paths: ['.github/workflows/inspect.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Dump API
        run: |
          B=https://dl.google.com/android/maven2/com/google/mlkit
          for a in genai-prompt genai-common; do
            V=$(curl -s $B/$a/maven-metadata.xml | grep -o '<latest>[^<]*' | sed 's/<latest>//')
            echo "::notice title=$a version::$V  releases: $(curl -s $B/$a/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | tr '\n' ' ')"
            curl -s -o $a.aar $B/$a/$V/$a-$V.aar
            mkdir -p $a && unzip -q -o $a.aar classes.jar -d $a
            curl -s $B/$a/$V/$a-$V.pom | grep -A2 '<artifactId>' | tr -d ' \n' | head -c 1500 > $a.pom.txt
            echo "::notice title=$a pom deps::$(cat $a.pom.txt)"
          done
          cd genai-prompt && unzip -q classes.jar -d c && cd ..
          cd genai-common && unzip -q classes.jar -d c && cd ..
          CLS=$(cd genai-prompt/c && find . -name '*.class' ! -name '*$*' | sed 's|^\./||;s|\.class$||;s|/|.|g' | grep -v internal | sort)
          echo "::notice title=prompt classes::$(echo $CLS | tr ' ' ',')"
          CCLS=$(cd genai-common/c && find . -name '*.class' ! -name '*$*' | sed 's|^\./||;s|\.class$||;s|/|.|g' | grep -v internal | sort)
          echo "::notice title=common classes::$(echo $CCLS | tr ' ' ',')"
          for c in com.google.mlkit.genai.prompt.java.GenerativeModelFutures com.google.mlkit.genai.prompt.Generation com.google.mlkit.genai.prompt.GenerateContentRequest\$Builder com.google.mlkit.genai.prompt.GenerateContentResponse com.google.mlkit.genai.prompt.Candidate com.google.mlkit.genai.common.FeatureStatus com.google.mlkit.genai.common.DownloadCallback com.google.mlkit.genai.prompt.TextPart; do
            OUT=$(javap -constants -public -cp genai-prompt/classes.jar:genai-common/classes.jar "$c" 2>&1 | grep -v '^Compiled' | tr '\n' '|' | sed 's/%/%25/g' | head -c 3000)
            echo "::notice title=$c::$OUT"
          done
